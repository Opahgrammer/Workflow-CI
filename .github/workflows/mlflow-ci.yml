name: MLflow CI Retrain and Build Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.12.1 pandas numpy scikit-learn

      - name: Run training script
        working-directory: MLProject
        run: |
          echo "🚀 Running model training..."
          python modelling.py

      - name: Get latest MLflow run ID
        id: get_run
        working-directory: MLProject
        run: |
          echo "🔍 Searching for latest MLflow run..."
          RUN_PATH=$(find . -type d -path "*/mlruns/0/*" | sort -r | head -1)
          if [ -z "$RUN_PATH" ]; then
            echo "❌ No MLflow run found!"
            exit 1
          fi
          RUN_ID=$(basename "$RUN_PATH")
          echo "✅ Found run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Build Docker image from MLflow model
        working-directory: MLProject
        run: |
          echo "🐳 Building Docker image from MLflow model..."
          mlflow models build-docker -m "runs:/${{ steps.get_run.outputs.run_id }}/model" -n heart-disease-mlflow --enable-mlserver

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag heart-disease-mlflow:latest ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest

      - name: Upload MLflow model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts
          path: MLProject/mlruns
