name: MLflow CI Retrain and Build Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install system dependencies (for Docker)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      # 4️⃣ Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn "mlflow<3"

      # 5️⃣ Run training script
      - name: Run training script
        working-directory: MLProject
        run: |
          echo "🚀 Running model training..."
          python modelling.py

      # 6️⃣ Find latest run ID from mlruns
      - name: Get latest MLflow run ID
        id: get_run
        working-directory: MLProject
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -1 | xargs -n1 basename)
          echo "Found run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      # 7️⃣ Build Docker image from logged MLflow model
      - name: Build Docker image from model
        working-directory: MLProject
        run: |
          echo "Building Docker image from MLflow model..."
          mlflow models build-docker -m "runs:/${{ steps.get_run.outputs.run_id }}/model" -n heart-disease-mlflow

      # 8️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9️⃣ Tag & Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker tag heart-disease-mlflow:latest ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest

      # 🔟 Upload model artifacts ke GitHub (opsional)
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts
          path: MLProject/mlruns
