name: MLflow CI Retrain and Build Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Install dependencies
      - name: Install Python dependencies
        working-directory: MLProject
        run: |
          python -m pip install --upgrade pip
          pip install "mlflow<3" pandas numpy scikit-learn

      # 5️⃣ Run model training to generate mlruns + latest_run.json
      - name: 🧠 Run training script
        working-directory: MLProject
        run: |
          echo "🚀 Running model training..."
          python modelling.py
          echo "✅ Training complete."

      # 6️⃣ Get latest MLflow run ID (gunakan latest_run.json agar pasti)
      - name: 🔍 Get latest MLflow run ID
        id: get_run
        working-directory: MLProject
        run: |
          echo "📄 Reading latest_run.json..."
          if [ ! -f "latest_run.json" ]; then
            echo "❌ latest_run.json not found!"
            exit 1
          fi
          RUN_ID=$(jq -r '.run_id' latest_run.json)
          echo "✅ Found run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      # 7️⃣ Build Docker image from logged MLflow model
      - name: 🐳 Build Docker image from MLflow model
        working-directory: MLProject
        run: |
          echo "🐳 Building Docker image from MLflow model..."
          mlflow models build-docker -m "runs:/${{ steps.get_run.outputs.run_id }}/model" -n heart-disease-mlflow

      # 8️⃣ Log in to Docker Hub
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9️⃣ Push Docker image to Docker Hub
      - name: 📦 Push Docker image
        run: |
          docker tag heart-disease-mlflow:latest ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest

      # 🔟 Upload MLflow artifacts for debugging (opsional)
      - name: 📤 Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts
          path: MLProject/mlruns
