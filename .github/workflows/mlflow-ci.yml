name: MLflow CI Retrain and Build Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.12.1 pandas numpy scikit-learn jq

      # 5️⃣ Jalankan training script
      - name: Run training script
        working-directory: MLProject
        run: |
          echo "🚀 Running model training..."
          python modelling.py

      # 6️⃣ Ambil run_id dan experiment_id
      - name: Get latest MLflow run info
        id: get_run
        working-directory: MLProject
        run: |
          echo "🔍 Reading latest_run.json..."
          cat latest_run.json

          RUN_ID=$(jq -r '.run_id' latest_run.json)
          EXP_ID=$(jq -r '.experiment_id' latest_run.json)

          echo "✅ Found Run ID: $RUN_ID"
          echo "✅ Found Experiment ID: $EXP_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "exp_id=$EXP_ID" >> $GITHUB_OUTPUT

      # 7️⃣ Install Maven (dibutuhkan oleh MLflow untuk Java dependencies)
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      # 8️⃣ Build Docker image dari model MLflow
      - name: Build Docker image from MLflow model (fix Python version)
        working-directory: MLProject
        env:
          MLFLOW_DOCKER_BASE_IMAGE: python:3.10-slim
        run: |
          echo "🐳 Building Docker image from MLflow model using Python 3.10 base image..."
          mlflow models build-docker -m "runs:/${{ steps.get_run.outputs.run_id }}/model" \
            -n heart-disease-mlflow \
            --enable-mlserver \
            --env-manager local

      # 9️⃣ Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      # 🔟 Push image ke Docker Hub
      - name: Push Docker image
        run: |
          docker tag heart-disease-mlflow:latest ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest

      # 11️⃣ Upload artifact mlruns (opsional)
      - name: Upload MLflow model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts
          path: MLProject/mlruns
