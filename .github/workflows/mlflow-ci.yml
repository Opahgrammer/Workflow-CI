name: MLflow CI Retrain and Build Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system deps (Docker CLI for build)
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn "mlflow<3"

      - name: Run training script (MLProject)
        working-directory: MLProject
        run: |
          python modelling.py
          cat latest_run.json

      - name: Read run_id
        id: get_run
        working-directory: MLProject
        run: |
          python - <<'PY'
import json
with open("latest_run.json") as f:
    d=json.load(f)
print(d["run_id"])
# print in GitHub action output
print("::set-output name=run_id::%s" % d["run_id"])
PY

      - name: Build Docker image from logged MLflow model
        working-directory: MLProject
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          RUN_ID=${{ steps.get_run.outputs.run_id }}
          echo "Using run id: $RUN_ID"
          # Build docker image from model logged in runs:/<run_id>/model
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n heart-disease-mlflow

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker tag heart-disease-mlflow:latest ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow:latest

      - name: Upload model artifact to GitHub Actions (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-artifact
          path: MLProject/mlruns
